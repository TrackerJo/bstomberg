[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# No SPA catch-all rewrite here on purpose. Every route is prerendered to a
# real file by scripts/prerender.mjs, so /research is served as a document
# rather than rewritten to the index. That also lets dist/404.html answer
# unmatched paths with a genuine 404 status instead of a 200.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
