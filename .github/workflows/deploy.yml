name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Domain to build for (see deploy-targets.mjs)
        type: choice
        options: [custom, github]
        default: custom

# Pages needs id-token to publish; contents:read is enough to build.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs are not cancelled, so a merge train still
# ends with the newest commit live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # DEPLOY_TARGET picks base path and site origin together (see
      # deploy-targets.mjs), so they can't drift apart. Pushes to main always
      # build for the custom domain, the live target; running this workflow
      # manually can flip it to "github" to publish the old
      # <owner>.github.io/bstomberg/ project-page URL instead. GitHub Pages
      # redirects that URL to the custom domain on its own once the domain is
      # configured, so normally both keep working without a manual build.
      - name: Build and prerender
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target || 'custom' }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
