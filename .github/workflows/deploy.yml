name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs id-token to publish; contents:read is enough to build.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs are not cancelled, so a merge train still
# ends with the newest commit live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Served from the custom domain root (see public/CNAME), not from a
      # /bstomberg/ subpath, so BASE_PATH is just "/". GitHub Pages redirects
      # the old <owner>.github.io/bstomberg/ URL to the custom domain on its
      # own once the domain is configured, so both URLs keep working.
      # SITE_URL is scheme and host only: the prerender adds BASE_PATH itself.
      # It makes social-card and canonical URLs absolute, which Twitter and
      # some scrapers require.
      - name: Build and prerender
        env:
          BASE_PATH: /
          SITE_URL: https://bstomberg.com
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
